name: pages

# Publishes the web app (web/) to GitHub Pages. The analysis server runs on Hugging Face Spaces,
# so the published config.js points the app at it (https://msingh2012-vocalize.hf.space).

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  API_BASE: https://msingh2012-vocalize.hf.space

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Point the app at the hosted server
        run: |
          cat > web/js/config.js <<EOF
          // Generated by .github/workflows/pages.yml for the GitHub Pages site.
          window.VOCALIZE_CONFIG = { apiBase: '${API_BASE}' };
          EOF
          touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
