name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: System audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg libportaudio2
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest tests -q
      - name: Pitch accuracy check
        run: python scripts/pitch_accuracy.py
