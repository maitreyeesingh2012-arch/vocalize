<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 62" fill="none" stroke="black" stroke-linecap="round" stroke-linejoin="round">
  <!-- Vocalize mark: an engraved vintage stage microphone (original drawing). Used as a CSS mask, so only shape matters. -->
  <defs>
    <clipPath id="head"><rect x="10.6" y="3.6" width="18.8" height="26.8" rx="9.4"/></clipPath>
    <clipPath id="neck"><path d="M13.6 31c.4 3.8 2.3 6.4 3.9 9h5c1.6-2.6 3.5-5.2 3.9-9z"/></clipPath>
  </defs>
  <g transform="rotate(14 20 33)">
    <!-- head: grille slats, engraved shading on the right edge -->
    <rect x="9.8" y="2.8" width="20.4" height="28.4" rx="10.2" stroke-width="1.9"/>
    <g clip-path="url(#head)">
      <path d="M8 6.6h24M8 8.6h24M8 10.6h24M8 12.6h24M8 20.4h24M8 22.4h24M8 24.4h24M8 26.4h24M8 28.4h24" stroke-width="0.9"/>
      <path d="M24.6 4v26M26.2 4v26M27.6 4v26" stroke-width="0.7"/>
      <path d="M12 4v26" stroke-width="0.5"/>
    </g>
    <!-- centre band with badge -->
    <rect x="8.8" y="14.4" width="22.4" height="4" rx="2" stroke-width="1.6"/>
    <path d="M23 16.4h6.5" stroke-width="0.6"/>
    <circle cx="15.2" cy="16.4" r="1" fill="black" stroke="none"/>
    <!-- flared neck with hatching -->
    <path d="M13.6 31c.4 3.8 2.3 6.4 3.9 9h5c1.6-2.6 3.5-5.2 3.9-9" stroke-width="1.7"/>
    <g clip-path="url(#neck)" stroke-width="0.7">
      <path d="M15 31.5l2.6 8M17.4 31.5l1.6 8M20 31.5v8.5M22.6 31.5l-1.6 8M25 31.5l-2.6 8"/>
    </g>
  </g>
  <!-- stem with knuckle -->
  <rect x="18" y="40.6" width="4" height="3" rx="1" stroke-width="1.4"/>
  <rect x="18.4" y="43.6" width="3.2" height="7.2" rx="0.6" stroke-width="1.3"/>
  <path d="M20.6 44.6v5.4" stroke-width="0.6"/>
  <!-- base: two rings, etched rim -->
  <ellipse cx="20" cy="54" rx="12.5" ry="3.6" stroke-width="1.8"/>
  <ellipse cx="20" cy="53.3" rx="5.6" ry="1.5" stroke-width="1"/>
  <path d="M7.5 54.3c0 2.3 5.6 4.3 12.5 4.3s12.5-2 12.5-4.3" stroke-width="1.4"/>
  <path d="M9.6 56.1l.6 1.2M12 57.2l.5 1.1M14.6 57.9l.3 1.1M17.3 58.3l.2 1.1M20 58.4v1.1M22.7 58.3l-.2 1.1M25.4 57.9l-.3 1.1M28 57.2l-.5 1.1M30.4 56.1l-.6 1.2" stroke-width="0.75"/>
</svg>
