<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 100">
  <!-- Microphone drawn as a lowercase "i": the round grille head is the dot, the handle is the stem.
       Used as a CSS mask, so only shape matters; the grille lines are cut out of the head. -->
  <defs>
    <mask id="grille">
      <circle cx="20" cy="16" r="13" fill="#fff"/>
      <g stroke="#000" stroke-width="1.6">
        <path d="M7 11h26M7 16h26M7 21h26M15 3v26M20 3v26M25 3v26"/>
      </g>
    </mask>
  </defs>
  <circle cx="20" cy="16" r="13" mask="url(#grille)"/>
  <circle cx="20" cy="16" r="13" fill="none" stroke="#000" stroke-width="2.4"/>
  <rect x="13" y="32" width="14" height="5" rx="1.5"/>
  <path d="M14 39h12l-2.2 52a3.8 3.8 0 0 1-7.6 0z"/>
</svg>
